services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tikahome-postgres
    environment:
      POSTGRES_DB: tikahome
      POSTGRES_USER: tikahome
      POSTGRES_PASSWORD: tikahome
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikahome -d tikahome"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
