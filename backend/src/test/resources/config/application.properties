# Test-only overrides. Spring Boot loads classpath:/config/application.properties on top of
# classpath:/application.yml, so these apply to every @SpringBootTest.
# No background sync during tests (tests call ChannelSyncService directly).
tikahome.ical.sync-enabled=false
# The fake feed server in tests is plain http://localhost.
tikahome.ical.allow-http=true
# Emails are sent by calling EmailSender directly; GreenMail (test SMTP server) listens on 3025.
tikahome.notifications.sender-enabled=false
spring.mail.port=3025
