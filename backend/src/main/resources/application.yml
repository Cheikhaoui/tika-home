server:
  port: 8081
  shutdown: graceful # finish in-flight requests before stopping (deploys, restarts)

# Only the health endpoints are exposed (liveness/readiness for the hosting platform's checks).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # A mail outage must not mark the app as down (the platform would restart it for nothing):
    # emails wait in the outbox and are retried.
    mail:
      enabled: false

spring:
  application:
    name: tikahome-backend
  config:
    # Local secrets (ANTHROPIC_API_KEY) from the git-ignored .env at the repository root, if present
    # (run from backend/ or from the root). In production the variables come from the environment.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://localhost:5433/tikahome
    username: tikahome
    password: tikahome
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches the entities
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mail:
    # Local dev: Mailpit from docker-compose (inbox at http://localhost:8025).
    # Production SMTP provider (Brevo, SES, ...) is configured in phase 6 via environment variables.
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  thymeleaf:
    check-template-location: false # templates are only used for emails, not web pages
  messages:
    basename: i18n/emails
    fallback-to-system-locale: false # unknown language -> English file, never the server's own locale

springdoc:
  swagger-ui:
    path: /swagger-ui.html

tikahome:
  ical:
    sync-enabled: true
    sync-interval: PT15M   # how often Airbnb / Booking.com calendars are imported
    initial-delay: PT30S
    connect-timeout: PT10S
    read-timeout: PT30S
    max-feed-size: 2MB
    allow-http: false
  notifications:
    owner-email: cheikhaoui.hicham@gmail.com
    owner-language: en
    from-address: "Tika Home <no-reply@tikahome.local>"
    site-url: http://localhost:3000
  admin:
    # Local development only. In production these come from environment variables
    # (TIKAHOME_ADMIN_JWT_SECRET, TIKAHOME_ADMIN_BOOTSTRAP_EMAIL, TIKAHOME_ADMIN_BOOTSTRAP_PASSWORD).
    jwt-secret: local-dev-only-secret-change-me-in-production-0123456789
    bootstrap-email: cheikhaoui.hicham@gmail.com
    bootstrap-password: local-dev-password
    cookie-secure: false # http://localhost; true (HTTPS only) in production
    allowed-origins: http://localhost:3000
  assistant:
    model-cache-directory: ${user.home}/.cache/tikahome/models # ~135 MB embedding model, downloaded once
    # Local development only; production: ASSISTANT_VISITOR_HASH_SECRET.
    visitor-hash-secret: local-dev-only-visitor-hash-secret-0123456789
