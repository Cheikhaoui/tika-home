server:
  port: 8081

spring:
  application:
    name: tikahome-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/tikahome
    username: tikahome
    password: tikahome
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches the entities
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

tikahome:
  ical:
    sync-enabled: true
    sync-interval: PT15M   # how often Airbnb / Booking.com calendars are imported
    initial-delay: PT30S
    connect-timeout: PT10S
    read-timeout: PT30S
    max-feed-size: 2MB
    allow-http: false
