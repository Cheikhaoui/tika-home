server:
  port: 8081

spring:
  application:
    name: tikahome-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/tikahome
    username: tikahome
    password: tikahome
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches the entities
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
