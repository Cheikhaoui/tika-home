<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: email(~{::content})}">
<div th:fragment="content">
  <p style="font-weight:bold;color:#b42318;" th:text="#{double.booking.owner.title}">Double booking detected</p>
  <p th:text="#{double.booking.owner.intro(${channelName})}">A reservation overlaps a direct booking.</p>
  <table th:replace="~{email/details :: stay}"></table>
  <p style="padding:12px 16px;background:#fef3f2;border-radius:6px;">
    <strong th:text="#{double.booking.owner.recommended}">Recommended action</strong><br>
    <span th:text="#{${recommendationKey}}">Recommendation</span>
  </p>
  <p th:text="#{double.booking.owner.never}">Nothing was cancelled automatically.</p>
</div>
</html>
