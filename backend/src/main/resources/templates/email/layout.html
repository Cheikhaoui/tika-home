<!DOCTYPE html>
<!--/* Shared email layout. Inline styles + tables: email clients (Gmail, Outlook) ignore most CSS. */-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="email(content)" th:lang="${lang}" th:dir="${dir}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${subject}">Tika Home</title>
</head>
<body style="margin:0;padding:0;background:#f6f1ea;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f1ea;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:560px;background:#ffffff;border-radius:8px;">
        <tr>
          <td style="padding:20px 28px;border-bottom:1px solid #eee3d6;font-size:20px;font-weight:bold;color:#8a4b2a;">
            Tika Home
          </td>
        </tr>
        <tr>
          <td style="padding:24px 28px;font-size:15px;line-height:1.6;color:#1f1a17;" th:insert="${content}"></td>
        </tr>
        <tr>
          <td style="padding:16px 28px;border-top:1px solid #eee3d6;font-size:12px;color:#8a817a;"
              th:text="#{email.footer}">Tika Home · Marrakech</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
