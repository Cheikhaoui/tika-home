<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: email(~{::content})}">
<div th:fragment="content">
  <p th:text="#{booking.declined.guest.greeting(${guestName})}">Hello,</p>
  <p th:text="#{booking.declined.guest.intro}">Unfortunately the house is not available.</p>
  <table th:replace="~{email/details :: stay}"></table>
  <p th:if="${ownerMessage}" style="padding:12px 16px;background:#f6f1ea;border-radius:6px;">
    <strong th:text="#{booking.declined.guest.ownerMessage}">Message from the owner</strong><br>
    <span th:text="${ownerMessage}">Message</span>
  </p>
  <p th:text="#{booking.declined.guest.next}">Other dates may be available.</p>
  <p><a th:href="${siteUrl}" style="color:#8a4b2a;" th:text="#{booking.declined.guest.cta}">See availability</a></p>
</div>
</html>
